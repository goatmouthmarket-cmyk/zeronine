"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "NIXPACKS"
buildCommand = "echo \"web bundle prebuilt locally and uploaded\""

[deploy]
startCommand = "node src/main.ts"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/data"
name = "overunder-data"

[env]
NODE_ENV = "production"
DATA_DIR = "/data"
DERIV_PUBLIC_URL = "wss://api.derivws.com/trading/v1/options/ws/public"
