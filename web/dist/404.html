<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183827">
  <title>Page not found | Deriv Cows</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;background:#183827}
    body{min-height:100svh;margin:0;padding:20px;display:grid;place-items:center;color:#273528;background:#183827;font:500 16px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
    .lost-card{width:min(420px,100%);padding:34px 28px;text-align:center;background:#f3ecd9;border-radius:10px;box-shadow:0 16px 42px #07170d55}
    .brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:22px;color:#36543a;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.08em}
    .brand img{width:30px;height:30px;object-fit:contain}
    .cow{display:block;width:112px;height:82px;margin:0 auto 14px;background:url('/cow-ui-assets.png') left top/560px auto no-repeat}
    .code{margin:0;color:#9a7224;font-size:12px;font-weight:800;letter-spacing:.14em}
    h1{margin:5px 0 8px;color:#26392b;font-size:clamp(27px,7vw,34px);line-height:1.15;letter-spacing:-.035em}
    p{margin:0 auto 22px;max-width:30ch;color:#62705f;font-size:14px}
    .actions{display:flex;align-items:center;justify-content:center;gap:18px}
    .home{display:inline-flex;min-height:43px;align-items:center;justify-content:center;padding:0 17px;border-radius:5px;background:#f0c75b;color:#2e321e;text-decoration:none;font-size:14px;font-weight:800}
    .guide{color:#466346;text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:700}
    @media(max-width:380px){.lost-card{padding:28px 19px}.actions{gap:14px}.home{padding:0 12px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="lost-card">
    <a class="brand" href="/" aria-label="Deriv Cows home"><img src="/deriv-cows-logo.png" alt=""> DERIV COWS</a>
    <span class="cow" aria-hidden="true"></span>
    <p class="code">404 · PAGE NOT FOUND</p>
    <h1>This trail wandered off.</h1>
    <p>Let’s get you back to the pasture.</p>
    <nav class="actions" aria-label="Page not found links">
      <a class="home" href="/">Back to pasture</a>
      <a class="guide" href="/how-to-play">How to play</a>
    </nav>
  </main>
</body>
</html>
